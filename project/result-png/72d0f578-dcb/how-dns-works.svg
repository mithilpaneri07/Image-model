    <text x="393.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Requests</text>
  </g>
  <g id="element-server">
    <circle cx="573.0" cy="575.0" r="70.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(561.0, 540.5) scale(1.000)"><rect x="2" y="2" width="20" height="8" rx="2" ry="2" fill="none" stroke="#3B82F6" stroke-width="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2" fill="none" stroke="#3B82F6" stroke-width="2"/><line x1="6" y1="6" x2="6.01" y2="6" stroke="#3B82F6" stroke-width="2"/><line x1="6" y1="18" x2="6.01" y2="18" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="573.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Server</text>
