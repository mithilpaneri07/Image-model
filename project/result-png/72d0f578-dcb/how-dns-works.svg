  <g id="element-flow">
    <polygon points="1160.0,489.0 1277.0,575.0 1160.0,661.0 1043.0,575.0" fill="url(#grad-highlight)" stroke="#B45309" stroke-width="1.5" filter="url(#card-shadow-hover)"/>
    <g transform="translate(1148.0, 540.5) scale(1.000)"><path d="M8 9l3 3-3 3" fill="none" stroke="#FFFFFF" stroke-width="2"/><line x1="13" y1="15" x2="16" y2="15" stroke="#FFFFFF" stroke-width="2"/><rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="1160.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Flow</text>
    <text x="1160.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Mapping</text>
  </g>
  </g>
  <text x="800.0" y="942.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">DNS is a system that translates domain names into IP addresses.</text>
