<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow-hover" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad-bg)" />
  <rect x="0" y="0" width="100%" height="4" fill="#3B82F6" />
  <text x="800.0" y="76.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="-0.5">API Working Diagram</text>
  <text x="800.0" y="106.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">API Lifecycle</text>
  <rect x="690.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="800.0" y="171.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Request -&gt; Processing -&gt; Response</text>
  <text x="800.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">API Lifecycle</text>
  <g id="connectors">
    <circle cx="579.5" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="579.5" y1="575.0" x2="611.5" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
    <circle cx="768.5" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="768.5" y1="575.0" x2="800.6" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
  </g>
  <g id="elements">
  <g id="element-request">
    <circle cx="500.9" cy="575.0" r="74.5" fill="url(#grad-primary)" stroke="#1D4ED8" stroke-width="1.5" filter="url(#card-shadow-hover)"/>
    <g transform="translate(488.9, 533.0) scale(1.000)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="500.9" y="574.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Request</text>
    <text x="500.9" y="596.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Client sends</text>
    <text x="500.9" y="611.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">request</text>
  </g>
  <g id="element-processing">
    <circle cx="690.0" cy="575.0" r="74.5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(678.0, 533.0) scale(1.000)"><rect x="2" y="2" width="20" height="8" rx="2" ry="2" fill="none" stroke="#64748B" stroke-width="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2" fill="none" stroke="#64748B" stroke-width="2"/><line x1="6" y1="6" x2="6.01" y2="6" stroke="#64748B" stroke-width="2"/><line x1="6" y1="18" x2="6.01" y2="18" stroke="#64748B" stroke-width="2"/></g>
    <text x="690.0" y="574.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Processing</text>
    <text x="690.0" y="596.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Server processes</text>
    <text x="690.0" y="611.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">request</text>
  </g>
  <g id="element-response">
    <circle cx="879.1" cy="575.0" r="74.5" fill="url(#grad-highlight)" stroke="#B45309" stroke-width="1.5" filter="url(#card-shadow-hover)"/>
    <g transform="translate(867.1, 533.0) scale(1.000)"><polyline points="16 18 22 12 16 6" fill="none" stroke="#FFFFFF" stroke-width="2"/><polyline points="8 6 2 12 8 18" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="879.1" y="574.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Response</text>
    <text x="879.1" y="596.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Server sends</text>
    <text x="879.1" y="611.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">response</text>
  </g>
  <g id="element-connector">
    <rect x="993.7" y="508.9" width="180.0" height="132.3" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(1071.7, 540.5) scale(1.000)"><path d="M8 9l3 3-3 3" fill="none" stroke="#3B82F6" stroke-width="2"/><line x1="13" y1="15" x2="16" y2="15" stroke="#3B82F6" stroke-width="2"/><rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="1083.7" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Connector</text>
    <text x="1083.7" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">HTTP</text>
  </g>
  </g>
  <text x="800.0" y="942.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">For more information, please refer to the provided documents.</text>
</svg>