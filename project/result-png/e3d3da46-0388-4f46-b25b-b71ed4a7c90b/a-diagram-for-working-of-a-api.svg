<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow-hover" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad-bg)" />
  <rect x="0" y="0" width="100%" height="4" fill="#3B82F6" />
  <text x="800.0" y="76.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="-0.5">API Diagram</text>
  <text x="800.0" y="106.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Understanding the Flow of a REST API</text>
  <rect x="330.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="440.0" y="171.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">GET, POST, PUT, DELETE</text>
  <text x="440.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">HTTP</text>
  <rect x="570.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="680.0" y="172.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Resource-based</text>
  <text x="680.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">REST</text>
  <rect x="810.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="920.0" y="172.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Data format</text>
  <text x="920.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">JSON</text>
  <rect x="1050.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="1160.0" y="172.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Authentication</text>
  <text x="1160.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">Auth</text>
  <g id="connectors">
    <circle cx="401.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="401.0" y1="575.0" x2="653.0" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
    <circle cx="653.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="653.0" y1="575.0" x2="621.0" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
    <circle cx="621.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="621.0" y1="575.0" x2="653.0" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
    <circle cx="947.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="947.0" y1="575.0" x2="1199.0" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
    <circle cx="947.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="947.0" y1="575.0" x2="979.0" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
  </g>
  <g id="elements">
  <g id="element-client">
    <circle cx="307.0" cy="575.0" r="90.0" fill="url(#grad-primary)" stroke="#1D4ED8" stroke-width="1.5" filter="url(#card-shadow-hover)"/>
    <g transform="translate(295.0, 540.5) scale(1.000)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="307.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Client</text>
    <text x="307.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Requests data</text>
  </g>
  <g id="element-server">
    <circle cx="527.0" cy="575.0" r="90.0" fill="url(#grad-primary)" stroke="#1D4ED8" stroke-width="1.5" filter="url(#card-shadow-hover)"/>
    <g transform="translate(515.0, 540.5) scale(1.000)"><rect x="2" y="2" width="20" height="8" rx="2" ry="2" fill="none" stroke="#FFFFFF" stroke-width="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2" fill="none" stroke="#FFFFFF" stroke-width="2"/><line x1="6" y1="6" x2="6.01" y2="6" stroke="#FFFFFF" stroke-width="2"/><line x1="6" y1="18" x2="6.01" y2="18" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="527.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Server</text>
    <text x="527.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Serves data</text>
  </g>
  <g id="element-api">
    <polygon points="800.0,484.0 943.0,575.0 800.0,666.0 657.0,575.0" fill="url(#grad-highlight)" stroke="#B45309" stroke-width="1.5" filter="url(#card-shadow-hover)"/>
    <g transform="translate(788.0, 540.5) scale(1.000)"><path d="M8 9l3 3-3 3" fill="none" stroke="#FFFFFF" stroke-width="2"/><line x1="13" y1="15" x2="16" y2="15" stroke="#FFFFFF" stroke-width="2"/><rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="800.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">API</text>
    <text x="800.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Connects client and server</text>
  </g>
  <g id="element-auth">
    <circle cx="1073.0" cy="575.0" r="90.0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(1061.0, 540.5) scale(1.000)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="#64748B" stroke-width="2"/></g>
    <text x="1073.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Auth</text>
    <text x="1073.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Ensures security</text>
  </g>
  <g id="element-response">
    <circle cx="1293.0" cy="575.0" r="90.0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(1281.0, 540.5) scale(1.000)"><ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="#64748B" stroke-width="2"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" fill="none" stroke="#64748B" stroke-width="2"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" fill="none" stroke="#64748B" stroke-width="2"/></g>
    <text x="1293.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Response</text>
    <text x="1293.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Data sent back</text>
  </g>
  </g>
  <text x="800.0" y="942.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Created by [Your Name]</text>
</svg>