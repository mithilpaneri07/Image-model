    <g transform="translate(1040.0, 540.5) scale(1.000)"><ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
