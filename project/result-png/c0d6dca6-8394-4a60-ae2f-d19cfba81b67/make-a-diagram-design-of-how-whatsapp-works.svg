    <text x="1052.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">WhatsApp Data Centers</text>
  </g>
  <g id="element-flow">
