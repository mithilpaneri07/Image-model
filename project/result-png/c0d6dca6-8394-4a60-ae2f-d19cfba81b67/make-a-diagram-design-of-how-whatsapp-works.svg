    <text x="643.0" y="573.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Authenticatio</text>
    <text x="643.0" y="591.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">n</text>
    <text x="643.0" y="612.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Auth Server</text>
