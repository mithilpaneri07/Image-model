    <g transform="translate(1307.0, 540.5) scale(1.000)"><path d="M8 9l3 3-3 3" fill="none" stroke="#3B82F6" stroke-width="2"/><line x1="13" y1="15" x2="16" y2="15" stroke="#3B82F6" stroke-width="2"/><rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
