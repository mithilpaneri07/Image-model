    <text x="1144.1" y="479.9" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Code Generator</text>
    <text x="1144.1" y="501.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Translates to machine</text>
    <text x="1144.1" y="516.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">code</text>
  </g>
