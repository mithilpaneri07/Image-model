<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow-hover" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad-bg)" />
  <rect x="0" y="0" width="100%" height="4" fill="#3B82F6" />
  <text x="800.0" y="76.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="-0.5">Compiler Workflow</text>
  <text x="800.0" y="106.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">A step-by-step guide</text>
  <rect x="570.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="680.0" y="172.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Source Code</text>
  <text x="680.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">Input</text>
  <rect x="810.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="920.0" y="172.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Machine Code</text>
