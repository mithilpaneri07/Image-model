    <g transform="translate(428.5, 438.4) scale(1.000)"><polyline points="16 18 22 12 16 6" fill="none" stroke="#FFFFFF" stroke-width="2"/><polyline points="8 6 2 12 8 18" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="440.5" y="479.9" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lexer</text>
