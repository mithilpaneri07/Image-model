    <text x="1364.1" y="487.4" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Machine Code</text>
    <text x="1364.1" y="509.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Executable by computer</text>
