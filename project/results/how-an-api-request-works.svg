    <g transform="translate(1157.1, 533.0) scale(1.000)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="1169.1" y="574.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Client</text>
