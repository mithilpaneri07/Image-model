<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow-hover" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad-bg)" />
  <rect x="0" y="0" width="100%" height="4" fill="#3B82F6" />
  <text x="800.0" y="76.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="-0.5">CI/CD Pipeline</text>
  <text x="800.0" y="106.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Continuous Integration &amp; Continuous Deployment</text>
  <rect x="570.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="680.0" y="173.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">5</text>
  <text x="680.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">Steps</text>
  <rect x="810.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="920.0" y="173.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">3</text>
  <text x="920.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">Tools</text>
  <g id="connectors">
    <circle cx="343.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="343.0" y1="575.0" x2="375.0" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
    <circle cx="563.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="563.0" y1="575.0" x2="595.0" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
    <circle cx="783.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="783.0" y1="575.0" x2="815.0" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
    <circle cx="1003.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="1003.0" y1="575.0" x2="1035.0" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
    <circle cx="1183.0" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="1183.0" y1="575.0" x2="1215.0" y2="575.0" stroke="#94A3B8" stroke-width="2"  marker-end="url(#arrowhead)" />
  </g>
  <g id="elements">
  <g id="element-start">
    <circle cx="269.0" cy="575.0" r="70.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(257.0, 540.5) scale(1.000)"><circle cx="12" cy="12" r="10" fill="none" stroke="#3B82F6" stroke-width="2"/><polyline points="12 6 12 12 16 14" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="269.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Start</text>
    <text x="269.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Initiate</text>
  </g>
  <g id="element-code">
    <rect x="379.0" y="508.9" width="180.0" height="132.3" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(457.0, 540.5) scale(1.000)"><polyline points="16 18 22 12 16 6" fill="none" stroke="#3B82F6" stroke-width="2"/><polyline points="8 6 2 12 8 18" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="469.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Code</text>
    <text x="469.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Commit</text>
  </g>
  <g id="element-build">
    <rect x="599.0" y="508.9" width="180.0" height="132.3" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(677.0, 540.5) scale(1.000)"><rect x="2" y="2" width="20" height="8" rx="2" ry="2" fill="none" stroke="#3B82F6" stroke-width="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2" fill="none" stroke="#3B82F6" stroke-width="2"/><line x1="6" y1="6" x2="6.01" y2="6" stroke="#3B82F6" stroke-width="2"/><line x1="6" y1="18" x2="6.01" y2="18" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="689.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Build</text>
    <text x="689.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Compile</text>
  </g>
  <g id="element-test">
    <rect x="819.0" y="508.9" width="180.0" height="132.3" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(897.0, 540.5) scale(1.000)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="909.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Test</text>
    <text x="909.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Run</text>
  </g>
  <g id="element-deploy">
    <circle cx="1109.0" cy="575.0" r="70.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(1097.0, 540.5) scale(1.000)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="1109.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Deploy</text>
    <text x="1109.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Publish</text>
  </g>
  <g id="element-loop">
    <polygon points="1310.0,489.0 1401.0,575.0 1310.0,661.0 1219.0,575.0" fill="url(#grad-highlight)" stroke="#B45309" stroke-width="1.5" filter="url(#card-shadow-hover)"/>
    <g transform="translate(1298.0, 540.5) scale(1.000)"><polyline points="16 18 22 12 16 6" fill="none" stroke="#FFFFFF" stroke-width="2"/><polyline points="8 6 2 12 8 18" fill="none" stroke="#FFFFFF" stroke-width="2"/></g>
    <text x="1310.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Loop</text>
    <text x="1310.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="rgba(255, 255, 255, 0.92)" text-anchor="middle">Repeat</text>
  </g>
  </g>
  <text x="800.0" y="942.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">CI/CD Pipeline: Automates software development and deployment processes.</text>
</svg>