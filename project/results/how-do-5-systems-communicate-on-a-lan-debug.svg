    <text x="984.5" y="596.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Interacts with</text>
    <text x="984.5" y="611.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">server</text>
  </g>
  <g id="element-database">
    <circle cx="1169.1" cy="575.0" r="70.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(1157.1, 540.5) scale(1.000)"><ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="#3B82F6" stroke-width="2"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" fill="none" stroke="#3B82F6" stroke-width="2"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="1169.1" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Database</text>
    <text x="1169.1" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Stores data</text>
  </g>
  </g>
  <text x="800.0" y="942.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">LAN: Local Area Network</text>
