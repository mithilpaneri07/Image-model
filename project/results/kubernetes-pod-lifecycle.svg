<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow-hover" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad-bg)" />
  <rect x="0" y="0" width="100%" height="4" fill="#3B82F6" />
  <text x="800.0" y="76.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="-0.5">Kubernetes Pod Lifecycle</text>
  <text x="800.0" y="106.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Understanding the stages of a Pod's life</text>
  <rect x="690.0" y="147.5" width="220.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="800.0" y="173.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">5</text>
  <text x="800.0" y="193.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">Stages</text>
  <g id="connectors">
    <circle cx="473.9" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="473.9" y1="575.0" x2="505.9" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
    <circle cx="693.9" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="693.9" y1="575.0" x2="725.9" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
    <circle cx="693.9" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="693.9" y1="575.0" x2="915.0" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
    <circle cx="693.9" cy="575.0" r="3.5" fill="#64748B"/>
    <line x1="693.9" y1="575.0" x2="1135.0" y2="575.0" stroke="#94A3B8" stroke-width="2"   />
  </g>
  <g id="elements">
  <g id="element-init">
    <circle cx="390.9" cy="575.0" r="79.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(378.9, 531.5) scale(1.000)"><polyline points="16 18 22 12 16 6" fill="none" stroke="#3B82F6" stroke-width="2"/><polyline points="8 6 2 12 8 18" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="390.9" y="573.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Initializatio</text>
    <text x="390.9" y="591.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">n</text>
    <text x="390.9" y="612.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Pod creation</text>
  </g>
  <g id="element-running">
    <rect x="509.9" y="508.9" width="180.0" height="132.3" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(587.9, 540.5) scale(1.000)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="#3B82F6" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="599.9" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Running</text>
    <text x="599.9" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Container execution</text>
  </g>
  <g id="element-terminating">
    <circle cx="804.4" cy="575.0" r="74.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(792.4, 533.0) scale(1.000)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="804.4" y="574.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Termination</text>
    <text x="804.4" y="596.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Graceful</text>
    <text x="804.4" y="611.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">shutdown</text>
  </g>
  <g id="element-succeeded">
    <rect x="919.0" y="508.9" width="180.0" height="132.3" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(997.0, 540.5) scale(1.000)"><ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="#3B82F6" stroke-width="2"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" fill="none" stroke="#3B82F6" stroke-width="2"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="1009.0" y="582.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Succeeded</text>
    <text x="1009.0" y="603.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Container completion</text>
  </g>
  <g id="element-failed">
    <circle cx="1213.5" cy="575.0" r="74.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <g transform="translate(1201.5, 533.0) scale(1.000)"><path d="M8 9l3 3-3 3" fill="none" stroke="#3B82F6" stroke-width="2"/><line x1="13" y1="15" x2="16" y2="15" stroke="#3B82F6" stroke-width="2"/><rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="none" stroke="#3B82F6" stroke-width="2"/></g>
    <text x="1213.5" y="574.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Failed</text>
    <text x="1213.5" y="596.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Container</text>
    <text x="1213.5" y="611.0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">failure</text>
  </g>
  </g>
  <text x="800.0" y="942.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Kubernetes lifecycle stages</text>
</svg>